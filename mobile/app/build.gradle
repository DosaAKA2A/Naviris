plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Firma release: se toma de ~/.android-keys/naviris-release.properties si existe
// (en CI ese archivo se genera desde los secretos del repo)
def signFile = new File(System.getProperty('user.home'), '.android-keys/naviris-release.properties')
def signProps = new Properties()
if (signFile.exists()) signFile.withInputStream { signProps.load(it) }

android {
    namespace 'com.estudiodeiris.naviris'
    compileSdk 34

    defaultConfig {
        // El identificador de la app en Android NO se cambia: con otro, el APK nuevo
        // se instalaría como una app aparte, sin los datos de la de siempre, y el
        // buscador de actualizaciones de la vieja no la reemplazaría nunca.
        applicationId "com.estudiodeiris.cobalt"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "2.2.1"
    }

    signingConfigs {
        if (signFile.exists()) {
            release {
                storeFile file(signProps['storeFile'])
                storePassword signProps['storePassword']
                keyAlias signProps['keyAlias']
                keyPassword signProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // NewPipeExtractor usa java.time/streams: desugaring para minSdk 24
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
    // Rat Tool: extracción de streams en el dispositivo (sin yt-dlp/ffmpeg)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
