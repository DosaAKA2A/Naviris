<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Ventana de arranque: no navega, no pide red y no toca el puente window.cobalt.
       Su CSP es la mínima que necesita (su propio script y estilos en línea). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Naviris</title>
  <style>
    /* Arranque 2026-09-09: anillo con etapas. Un solo tono, sin el degradado de
       cinco colores: el arranque es momento de MARCA, y la marca aquí es la forma
       del isotipo, no su paleta. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #0a0a0c;
      color: #cfd0d5;
      font-family: "Inter Var", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      user-select: none; cursor: default;
      /* Toda la superficie arrastra: es una ventana sin marco y sin botones. */
      -webkit-app-region: drag;
      border-radius: 16px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    }
    /* Entrada UNA vez y termina: ninguna animación queda viva (regla del proyecto). */
    @keyframes entra { 0% { transform: translateY(8px) scale(.96); opacity: 0; } 100% { transform: none; opacity: 1; } }
    .anillo { position: relative; width: 148px; height: 148px; animation: entra .5s cubic-bezier(.2,.9,.3,1) both; }
    .anillo svg.aro { position: absolute; inset: 0; transform: rotate(-90deg); }
    /* El arco AVANZA con los hitos reales del proceso principal (ver splash.js);
       la transición solo suaviza el salto entre uno y otro. */
    .anillo .aro .avance { transition: stroke-dashoffset .45s cubic-bezier(.32,.72,.28,1); }
    .anillo .centro { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; line-height: 0; }
    .anillo .iris-logo path { fill: #ececef; }
    /* La etapa cambia de texto con un fundido corto; cada cambio es una animación
       que termina, no un bucle. */
    .etapa { font-size: 12.5px; color: #9a9ba3; min-height: 16px; animation: entra .5s cubic-bezier(.2,.9,.3,1) .1s both; }
    .etapa.cambia { animation: aparece .28s ease-out both; }
    @keyframes aparece { 0% { opacity: 0; transform: translateY(3px); } 100% { opacity: 1; transform: none; } }
    .pie { position: absolute; bottom: 16px; font-size: 10px; letter-spacing: .4px; color: #55565e; }
  </style>
</head>
<body>
  <div class="anillo">
    <svg class="aro" viewBox="0 0 148 148" width="148" height="148" aria-hidden="true">
      <circle cx="74" cy="74" r="70" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
      <circle class="avance" id="avance" cx="74" cy="74" r="70" fill="none" stroke="#e8e8ec" stroke-width="1.5" stroke-linecap="round"
              stroke-dasharray="439.82" stroke-dashoffset="439.82"/>
    </svg>
    <div class="centro" id="marca"></div>
  </div>
  <div class="etapa" id="etapa"></div>
  <div class="pie" id="pie"></div>
  <script src="icons.js"></script>
  <script src="splash.js"></script>
</body>
</html>
