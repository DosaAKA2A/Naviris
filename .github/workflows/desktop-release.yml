name: Desktop Release (solo compilacion de prueba)

# IMPORTANTE: desde Naviris 2.6.0 la base es castlabs Electron (+wvcus) y el
# instalable NECESITA la firma VMP de castlabs (EVS) para que Widevine conceda
# licencias; sin ella Crunchyroll y el resto de DRM dejan de reproducir.
# Esa firma se hace en LOCAL con el hook build/evs-sign.js (requiere la cuenta
# EVS), y aqui se omite a proposito. Por eso este workflow YA NO PUBLICA nada:
# si lo hiciera, machacaria los assets firmados con un build sin Widevine
# (ocurrio el 2026-07-25 con la v2.6.0-dev.3).
#
# Flujo de publicacion vigente:
#   1. En local: `npm run release` -> `npm run dist` (compila y firma VMP) y
#      luego build/publish-release.js, que corre `npm test` (y no publica si
#      falla), sube los assets y genera el feed.
#      NO usar `electron-builder --publish`: sus dos publicadores (nsis y
#      portable) compiten por crear la misma release y el segundo muere con un
#      422, dejandola sin instalador y sin .yml. Por eso existe el script.
#   2. Al publicarse la release, "Mobile APK" adjunta el APK automaticamente.
#
# Este workflow queda solo como comprobacion manual de que el proyecto compila.
# Y no compila si fallan las pruebas: el job "pruebas" (pruebas.yml) va antes y
# "compilar" lo necesita (needs). Si algun dia este workflow vuelve a publicar,
# el paso de publicar tiene que ir en un job que tambien dependa de "pruebas".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    uses: ./.github/workflows/pruebas.yml

  compilar:
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: el Electron de castlabs pide >= 22.12, y es con el que se prueba
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # electron (castlabs) viene de GitHub por git y el lock lo apunta por ssh
      - name: Dependencias de GitHub por https (sin clave ssh)
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Instalar dependencias
        run: npm ci

      # Clave con la que Naviris abre MOOVIN sin pedir nada. No esta en el repo
      # (main es publico y Pages lo sirve entero), asi que la pone el secret.
      # Si el secret no esta configurado, el archivo queda vacio y Naviris pide
      # el pase como cualquier navegador: la compilacion NO falla por esto.
      - name: Escribir la clave de MOOVIN
        shell: bash
        env:
          NAVIRIS_MOOVIN_KEY: ${{ secrets.NAVIRIS_MOOVIN_KEY }}
        run: |
          printf "module.exports = '%s';\n" "$NAVIRIS_MOOVIN_KEY" > src/app-key.js
          if [ -z "$NAVIRIS_MOOVIN_KEY" ]; then
            echo "AVISO: sin NAVIRIS_MOOVIN_KEY; este build pedira el pase en MOOVIN"
          fi

      # Las comillas son OBLIGATORIAS: sin ellas, el ": " de "VMP: no distribuir"
      # convierte el escalar en un mapa anidado y GitHub rechaza el fichero entero
      # ("workflow file issue"). Estuvo asi del 2026-07-25 al 2026-07-31: el
      # workflow no se registraba y CADA push a main dejaba un run fallido sin jobs.
      - name: 'Compilar sin publicar (SIN firma VMP: no distribuir)'
        run: npm run dist
        env:
          EVS_SKIP: '1'
